services:
  - type: web
    name: payharness-api
    runtime: node
    rootDir: payharness
    buildCommand: npm install && npm run build
    startCommand: npm run db:setup && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 16.20.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CHECKOUT_URL
        sync: false
