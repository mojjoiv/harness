name: One-time Prettier Fix

on:
  push:
    branches:
      - fix/lint-warnings-cleanup

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply one-time prettier fix') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payharness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payharness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format affected API key service
        run: npx prettier --write apps/api/src/api-keys/api-keys.service.ts

      - name: Commit formatted file
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/api-keys/api-keys.service.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: apply one-time prettier fix"
          git push
