name: One-time Prettier Fix

on:
  push:
    branches:
      - test/auth-service-coverage

permissions:
  contents: write

jobs:
  format-auth-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payharness/package-lock.json

      - name: Install dependencies
        working-directory: payharness
        run: npm ci

      - name: Format auth service spec with repository Prettier
        working-directory: payharness
        run: npx prettier --write apps/api/src/auth/auth.service.spec.ts

      - name: Verify formatting
        working-directory: payharness
        run: npx prettier --check apps/api/src/auth/auth.service.spec.ts

      - name: Commit formatted file and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add payharness/apps/api/src/auth/auth.service.spec.ts .github/workflows/one-time-prettier-fix.yml

          if git diff --cached --quiet; then
            echo "No changes were produced by Prettier."
            exit 0
          fi

          git commit -m "fix: apply prettier formatting to auth service test"
          git push origin HEAD:test/auth-service-coverage
