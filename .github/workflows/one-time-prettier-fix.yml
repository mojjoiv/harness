name: One-time Prettier Fix

on:
  push:
    branches:
      - test/auth-service-coverage

permissions:
  contents: write

jobs:
  format-auth-spec:
    if: !contains(github.event.head_commit.message, 'apply prettier formatting')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format auth service spec with Prettier
        working-directory: payharness
        run: npx --yes prettier@3.9.0 --write apps/api/src/auth/auth.service.spec.ts

      - name: Verify formatting with the same Prettier version
        working-directory: payharness
        run: npx --yes prettier@3.9.0 --check apps/api/src/auth/auth.service.spec.ts

      - name: Commit formatted file and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/auth/auth.service.spec.ts
          git rm .github/workflows/one-time-prettier-fix.yml
          git commit -m "fix: apply prettier formatting to auth service test"
          git push origin HEAD:test/auth-service-coverage
