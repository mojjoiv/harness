name: Temporary branch formatter

on:
  push:
    branches:
      - feat/webhook-idempotency-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
      - run: npm install
        working-directory: payharness
      - run: npx prettier --write apps/api/src/webhooks/paypal-webhook.service.ts apps/api/src/webhooks/webhooks.service.ts
        working-directory: payharness
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/webhooks/paypal-webhook.service.ts payharness/apps/api/src/webhooks/webhooks.service.ts
          git commit -m "style(webhooks): apply Prettier formatting"
          git push
