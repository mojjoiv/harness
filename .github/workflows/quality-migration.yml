name: One-time quality migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[quality-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - name: Refresh lockfile and remove secret logging
        shell: bash
        run: |
          set -euo pipefail
          cd payharness
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/payments/payments.service.ts')
          text = path.read_text()
          block = '''      this.logger.error(\"===== DECRYPTED SECRETS =====\");
this.logger.error(`ConsumerKey: ${secrets.consumerKey}`);
this.logger.error(`ConsumerSecret: ${secrets.consumerSecret.substring(0,12)}...`);
this.logger.error(`Passkey: ${secrets.passkey}`);
this.logger.error(\"============================\");
'''
          replacement = "      this.logger.warn(`[correlationId=${correlationId}] M-Pesa credentials decrypted for provider call (values redacted)`);\n"
          if block not in text:
              raise SystemExit('Expected secret logging block was not found')
          path.write_text(text.replace(block, replacement, 1))
          PY
          cd ..
          rm -f .github/workflows/quality-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payharness/package-lock.json payharness/apps/api/src/payments/payments.service.ts .github/workflows/quality-migration.yml
          git diff --cached --check
          git commit -m '[quality-bot] security: remove plaintext credential logging and refresh lockfile'
          git push
