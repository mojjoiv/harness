name: CI

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Install dependencies
        working-directory: payharness
        run: npm install
      - name: Generate Prisma Client
        working-directory: payharness
        run: npm run prisma:generate
      - name: Typecheck
        working-directory: payharness
        run: npm run typecheck
      - name: Lint
        working-directory: payharness
        run: npm run lint
      - name: Format check
        working-directory: payharness
        run: npm run format:check:changed
      - name: WooCommerce PHP syntax
        run: find integrations/woocommerce -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Joomla PHP syntax
        run: find integrations/joomla -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP SDK validation
        working-directory: payharness/packages/sdk-php
        run: |
          composer validate --no-check-publish
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/ClientTest.php
          php tests/WebhookTest.php
      - name: Python SDK validation
        working-directory: payharness/packages/sdk-python
        run: |
          python3 -m pip install -q pytest
          python3 -m compileall payharness tests
          python3 -m pytest -q
      - name: Node.js SDK build
        working-directory: payharness
        run: npm --workspace packages/sdk-js run build
      - name: Node.js SDK tests
        working-directory: payharness
        run: npm --workspace packages/sdk-js test
      - name: Node.js SDK package check
        working-directory: payharness
        run: npm --workspace packages/sdk-js run pack:check
      - name: API and dashboard tests with coverage
        working-directory: payharness
        run: npm run test:cov
      - name: Dependency audit
        working-directory: payharness
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
