name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Install dependencies
        working-directory: payharness
        run: npm install
      - name: Generate Prisma Client
        working-directory: payharness
        run: npm run prisma:generate
      - name: Typecheck
        working-directory: payharness
        run: npm run typecheck
      - name: Lint
        working-directory: payharness
        run: npm run lint
      - name: Format check
        working-directory: payharness
        run: npm run format:check:changed
      - name: API and dashboard tests with coverage
        working-directory: payharness
        run: npm run test:cov
      - name: Dependency audit
        working-directory: payharness
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
