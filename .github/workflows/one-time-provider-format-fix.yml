name: One-time provider credentials verification

on:
  push:
    branches:
      - feat/provider-credentials-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/provider-credentials-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Install dependencies and sync lockfile
        working-directory: payharness
        run: npm install

      - name: Commit lockfile sync separately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- payharness/package-lock.json; then
            echo "package-lock.json is already synchronized"
          else
            git add payharness/package-lock.json
            git commit -m "chore: sync package-lock.json with package.json"
          fi

      - name: Validate clean npm ci
        working-directory: payharness
        run: npm ci

      - name: Generate Prisma client
        working-directory: payharness
        run: npm run prisma:generate

      - name: Format provider credentials files
        working-directory: payharness
        run: |
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.ts
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.spec.ts
          npm run format:check:changed

      - name: Fix Stripe test fixture to match its stored credential
        working-directory: payharness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/provider-credentials/provider-credentials.service.spec.ts')
          text = path.read_text()
          marker = "    prisma.providerCredential.upsert.mockResolvedValue(credential);\n    prisma.providerCredential.findFirst.mockResolvedValue(credential);\n    prisma.providerCredential.update.mockResolvedValue(verified);"
          replacement = "    prisma.providerCredential.upsert.mockResolvedValue(credential);\n    prisma.providerCredential.findFirst.mockResolvedValue(credential);\n    crypto.decrypt.mockReturnValue({ secretKey: 'sk_test' });\n    prisma.providerCredential.update.mockResolvedValue(verified);"
          if marker not in text:
              raise SystemExit('Stripe save test marker not found; refusing to modify the wrong location')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.spec.ts
          npm run format:check:changed

      - name: Run targeted provider credentials tests
        working-directory: payharness
        run: npm run test:cov -- provider-credentials

      - name: Commit verified formatting and test fix separately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- payharness/apps/api/src/provider-credentials/provider-credentials.service.ts payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts; then
            echo "Provider credential files already clean"
          else
            git add payharness/apps/api/src/provider-credentials/provider-credentials.service.ts payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts
            git commit -m "style: fix prettier formatting in provider-credentials.service.ts"
          fi

      - name: Final verification
        working-directory: payharness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check:changed
          npm run test:cov

      - name: Push verified commits
        run: git push origin HEAD:feat/provider-credentials-coverage

      - name: Report stale workflow
        run: |
          echo "one-time-provider-format-fix.yml remains intentionally present pending explicit approval to delete it."
