name: One-time provider credentials format fix

on:
  push:
    branches:
      - feat/provider-credentials-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/provider-credentials-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: payharness
        run: npm ci

      - name: Format provider credentials files
        working-directory: payharness
        run: |
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.ts
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.spec.ts

      - name: Verify formatting
        working-directory: payharness
        run: |
          npx prettier --check apps/api/src/provider-credentials/provider-credentials.service.ts
          npx prettier --check apps/api/src/provider-credentials/provider-credentials.service.spec.ts

      - name: Commit formatted files and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-provider-format-fix.yml
          git add payharness/apps/api/src/provider-credentials/provider-credentials.service.ts payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts .github/workflows/one-time-provider-format-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "chore: format provider credentials files"
          git push origin HEAD:feat/provider-credentials-coverage
