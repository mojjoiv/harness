name: Temporary format payments service

on:
  push:
    branches:
      - fix/stripe-payment-status-typecheck

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Install dependencies
        working-directory: payharness
        run: npm install
      - name: Format payments service
        working-directory: payharness
        run: npx prettier --write apps/api/src/payments/payments.service.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- payharness/apps/api/src/payments/payments.service.ts; then
            echo "No formatting changes needed"
          else
            git add payharness/apps/api/src/payments/payments.service.ts
            git commit -m "style: format payments service with prettier"
            git push --force origin HEAD:fix/stripe-payment-status-typecheck
          fi

# temporary trigger
