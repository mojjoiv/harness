name: Temporary PayPal webhook formatting

on:
  push:
    branches:
      - feat/paypal-webhook-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
      - name: Install dependencies
        working-directory: payharness
        run: npm install
      - name: Format PayPal webhook files
        working-directory: payharness
        run: npx prettier --write apps/api/src/webhooks/paypal-webhook.service.ts apps/api/src/webhooks/paypal-webhook.service.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- payharness/apps/api/src/webhooks/paypal-webhook.service.ts payharness/apps/api/src/webhooks/paypal-webhook.service.spec.ts; then
            exit 0
          fi
          git add payharness/apps/api/src/webhooks/paypal-webhook.service.ts payharness/apps/api/src/webhooks/paypal-webhook.service.spec.ts
          git commit -m "style(paypal): apply Prettier formatting"
          git push origin HEAD:feat/paypal-webhook-verification
