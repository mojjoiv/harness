name: One-time provider credentials test fix

on:
  push:
    branches:
      - feat/provider-credentials-coverage

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/provider-credentials-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payharness/package-lock.json

      - name: Install dependencies
        working-directory: payharness
        run: npm ci

      - name: Fix private method spies
        working-directory: payharness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/provider-credentials/provider-credentials.service.spec.ts')
          text = path.read_text()
          old = "jest.spyOn(service as never, 'checkWebhookReachable')"
          new = "jest.spyOn(service as any, 'checkWebhookReachable')"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 private-method spies, found {count}')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.spec.ts

      - name: Verify targeted test
        working-directory: payharness
        run: npx jest apps/api/src/provider-credentials/provider-credentials.service.spec.ts --runInBand

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/one-time-provider-credentials-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts .github/workflows/one-time-provider-credentials-fix.yml
          git diff --cached --quiet || git commit -m "fix: correct provider credentials test spies"
          git push origin HEAD:feat/provider-credentials-coverage
