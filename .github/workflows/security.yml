name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dast_target:
        description: 'Deployed PayHarness API base URL for the OWASP ZAP baseline scan'
        required: false
        type: string

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: false

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: results/*.sarif
          if-no-files-found: error

  trivy:
    name: Container/filesystem security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh dependency lockfile
        working-directory: payharness
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: payharness-lockfile
          path: payharness/package-lock.json
          if-no-files-found: error

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  container:
    name: Container image security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh dependency lockfile
        working-directory: payharness
        run: npm install --package-lock-only --ignore-scripts

      - name: Build API container
        run: docker build -f payharness/apps/api/Dockerfile -t payharness:security payharness

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payharness:security
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: payharness-sbom.cdx.json
          output-file: payharness-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: payharness-sbom
          path: payharness-sbom.cdx.json
          if-no-files-found: error

  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.dast_target || 'https://harness-m6qs.onrender.com' }}
          fail_action: true
          allow_issue_writing: false
