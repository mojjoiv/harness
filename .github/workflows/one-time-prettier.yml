name: One-time Prettier fix

on:
  push:
    branches:
      - test/auth-service-coverage

permissions:
  contents: write

jobs:
  format-once:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: one-time prettier fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/auth-service-coverage
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: payharness/package-lock.json

      - name: Install dependencies
        working-directory: payharness
        run: npm ci

      - name: Format auth service test with repository Prettier
        working-directory: payharness
        run: npx prettier --write apps/api/src/auth/auth.service.spec.ts

      - name: Verify formatting
        working-directory: payharness
        run: npx prettier --check apps/api/src/auth/auth.service.spec.ts

      - name: Commit formatted file and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/auth/auth.service.spec.ts .github/workflows/one-time-prettier.yml
          git commit -m "chore: one-time prettier fix" || exit 0
          git push origin test/auth-service-coverage
