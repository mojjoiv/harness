name: Temporary main provider test fix

on:
  push:
    branches:
      - tmp/fix-main-provider-credentials-test

permissions:
  contents: write

jobs:
  fix-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Fix Stripe save test fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts')
          text = path.read_text()
          marker = "    prisma.providerCredential.upsert.mockResolvedValue(credential);\n    prisma.providerCredential.findFirst.mockResolvedValue(credential);\n    prisma.providerCredential.update.mockResolvedValue(verified);"
          replacement = "    prisma.providerCredential.upsert.mockResolvedValue(credential);\n    prisma.providerCredential.findFirst.mockResolvedValue(credential);\n    crypto.decrypt.mockReturnValue({ secretKey: 'sk_test' });\n    prisma.providerCredential.update.mockResolvedValue(verified);"
          if marker not in text:
              raise SystemExit('Stripe save test marker not found; refusing to modify the wrong location')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Install dependencies
        working-directory: payharness
        run: npm install

      - name: Generate Prisma client
        working-directory: payharness
        run: npm run prisma:generate

      - name: Verify formatting and targeted test
        working-directory: payharness
        run: |
          npx prettier --write apps/api/src/provider-credentials/provider-credentials.service.spec.ts
          npm run format:check:changed
          npm run test:cov -- provider-credentials

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/apps/api/src/provider-credentials/provider-credentials.service.spec.ts
          git commit -m "test: align provider credential Stripe fixture with saved secret"
          git push origin HEAD:main
