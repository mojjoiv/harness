name: Synchronize npm lockfile

on:
  push:
    branches:
      - feat/phase-6-api-v1

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: payharness/package-lock.json
      - name: Regenerate lockfile
        working-directory: payharness
        run: npm install --package-lock-only
      - name: Verify lockfile
        working-directory: payharness
        run: npm ci
      - name: Commit lockfile
        run: |
          if git diff --quiet -- payharness/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payharness/package-lock.json
          git commit -m "chore: synchronize npm lockfile with workspace manifests"
          git push
