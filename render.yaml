services:
  - type: web
    name: payharness
    runtime: node
    rootDir: payharness
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:setup
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: CHECKOUT_URL
        value: https://harness-1.onrender.com
      - key: FRONTEND_URL
        value: https://harness-1.onrender.com
      - key: APP_URL
        value: https://harness-m6qs.onrender.com
